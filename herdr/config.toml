# Herdr configuration
# https://herdr.dev/docs/configuration/
#
# Symlink to the expected location:
#   mkdir -p ~/.config/herdr
#   ln -sf ~/dotfiles/herdr/config.toml ~/.config/herdr/config.toml
#
# Reload a running session with `prefix + shift+r` or:
#   herdr server reload-config
#
# View all defaults: herdr --default-config
# Reset key customizations (with backup): herdr config reset-keys

onboarding = false

[theme]
name = "catppuccin"
auto_switch = false

[terminal]

[update]

# ---------------------------------------------------------------------------
# Keybindings — Ctrl+T prefix (tmux muscle memory), herdr defaults otherwise:
#   split right = prefix+v      split below = prefix+minus
#   focus panes = prefix+h/j/k/l    tabs = prefix+c / prefix+n / prefix+p
#   detach = prefix+q    copy mode = prefix+[    sidebar = prefix+b
#   help = prefix+?
# ---------------------------------------------------------------------------
[keys]
prefix = "ctrl+t"
previous_workspace = "prefix+up" # optional, unset by default
next_workspace = "prefix+down" # optional, unset by default
previous_agent = "prefix+," # optional, unset by default
next_agent = "prefix+." # optional, unset by default
switch_workspace = "prefix+shift+1..9"  # optional indexed binding, e.g. "prefix+shift+1..9"
last_pane = "prefix+o"  # optional, unset by default; bind e.g. "prefix+tab" for global back-and-forth

[ui]
confirm_close = true
prompt_new_tab_name = false
show_agent_labels_on_pane_borders = true

[ui.toast]
delivery = "system"
